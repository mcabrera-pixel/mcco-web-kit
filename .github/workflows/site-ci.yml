# Workflow reutilizable (Estándar Web MCCO v2 §7): build + mcco-check en cada PR, y preview deploy si hay credenciales.
# El proyecto Cloudflare sale de site.yaml (cloudflare.project). Uso en el sitio (.github/workflows/ci.yml):
#   on: { pull_request: { branches: [main] } }
#   jobs: { ci: { uses: mcabrera-pixel/mcco-web-kit/.github/workflows/site-ci.yml@v1.1.3, secrets: inherit } }
# Los scripts del kit corren con node desde node_modules del sitio, nunca con npx (si el paquete instalado no los trae,
# npx los busca en el registro público de npm). Por eso la ref del workflow (@vX.Y.Z) y la versión del paquete van juntas.
name: site-ci

on:
  workflow_call:
    inputs:
      project:
        description: Obsoleto desde v1.1.3 (el proyecto sale de site.yaml). Si se pasa, debe coincidir.
        required: false
        type: string
        default: ''
      node:
        required: false
        type: string
        default: '24.21.0'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastmod real en el sitemap (git log por archivo)

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      - run: npm ci

      - name: Proyecto y dominio desde site.yaml
        id: sitio
        env:
          PROYECTO_INPUT: ${{ inputs.project }}
        run: node node_modules/@mcco/web-kit/scripts/sitio-ci.mjs

      - name: Build
        run: npm run build

      - name: mcco-check (Estándar Web MCCO v2)
        run: node node_modules/@mcco/web-kit/scripts/check.mjs --dist dist

      - name: Preview deploy en Cloudflare Pages
        if: env.HAS_CF == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.sitio.outputs.project }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Resumen
        run: |
          {
            echo "## Estándar Web MCCO v2 · CI"
            echo "- Proyecto Cloudflare: \`${{ steps.sitio.outputs.project }}\`"
            echo "- mcco-check: cumple"
            if [ "$HAS_CF" = "true" ]; then echo "- Preview: ${{ steps.deploy.outputs.deployment-url }}"; else echo "- Preview: sin credenciales Cloudflare en este repo (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
