# Workflow reutilizable (Estándar Web MCCO v2 §7): push a main = build + mcco-check + deploy producción + smoke.
# El proyecto sale de site.yaml. El smoke (scripts/smoke.sh) prueba <proyecto>.pages.dev y, si el dominio ya está
# conectado al proyecto, también el dominio. Uso en el sitio (.github/workflows/deploy.yml):
#   on: { push: { branches: [main] }, workflow_dispatch: {} }
#   jobs: { deploy: { uses: mcabrera-pixel/mcco-web-kit/.github/workflows/site-deploy.yml@v1.1.3, secrets: inherit } }
# Los scripts del kit corren con node desde node_modules del sitio, nunca con npx (si el paquete instalado no los trae,
# npx los busca en el registro público de npm). Por eso la ref del workflow (@vX.Y.Z) y la versión del paquete van juntas.
name: site-deploy

on:
  workflow_call:
    inputs:
      project:
        description: Obsoleto desde v1.1.3 (el proyecto sale de site.yaml). Si se pasa, debe coincidir.
        required: false
        type: string
        default: ''
      node:
        required: false
        type: string
        default: '24.21.0'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      - run: npm ci

      - name: Proyecto y dominio desde site.yaml
        id: sitio
        env:
          PROYECTO_INPUT: ${{ inputs.project }}
        run: node node_modules/@mcco/web-kit/scripts/sitio-ci.mjs

      - name: Build
        run: npm run build

      - name: mcco-check (Estándar Web MCCO v2)
        run: node node_modules/@mcco/web-kit/scripts/check.mjs --dist dist

      - name: Deploy producción (Cloudflare Pages)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.sitio.outputs.project }} --branch=main --commit-hash=${{ github.sha }}

      - name: Smoke en producción
        env:
          PROYECTO: ${{ steps.sitio.outputs.project }}
          DOMINIO: ${{ steps.sitio.outputs.domain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash node_modules/@mcco/web-kit/scripts/smoke.sh
