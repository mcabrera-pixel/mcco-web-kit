# Workflow reutilizable (Estándar Web MCCO v2 §7): build + mcco-check en cada PR, y preview deploy si hay credenciales.
# Uso en el sitio (.github/workflows/ci.yml):
#   on: { pull_request: { branches: [main] } }
#   jobs: { ci: { uses: mcabrera-pixel/mcco-web-kit/.github/workflows/site-ci.yml@v1, with: { project: 3d-ultra }, secrets: inherit } }
name: site-ci

on:
  workflow_call:
    inputs:
      project:
        description: Nombre del proyecto en Cloudflare Pages
        required: true
        type: string
      node:
        required: false
        type: string
        default: '24'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastmod real en el sitemap (git log por archivo)

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: mcco-check (Estándar Web MCCO v2)
        run: npx mcco-check --dist dist

      - name: Preview deploy en Cloudflare Pages
        if: env.HAS_CF == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Resumen
        run: |
          {
            echo "## Estándar Web MCCO v2 — CI"
            echo "- Proyecto Cloudflare: \`${{ inputs.project }}\`"
            echo "- mcco-check: ✅ cumple"
            if [ "$HAS_CF" = "true" ]; then echo "- Preview: ${{ steps.deploy.outputs.deployment-url }}"; else echo "- Preview: sin credenciales Cloudflare en este repo (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
